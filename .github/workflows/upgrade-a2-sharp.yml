name: A2 temporary sharp security upgrade

on:
  push:
    branches:
      - keskinlab-stabilization-a2-preflight

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[sharp-upgrade]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: keskinlab-stabilization-a2-preflight

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade sharp to patched line
        run: npm install 'sharp@^0.35.3' --save

      - name: Audit high severity dependencies
        run: npm audit --audit-level=high

      - name: Verify full KeskinLab build
        run: npm run build

      - name: Commit dependency upgrade
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency already upgraded."
            exit 0
          fi
          git config user.name "KeskinLab Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade sharp to patched 0.35 line [sharp-upgrade]"
          git push origin HEAD:keskinlab-stabilization-a2-preflight
