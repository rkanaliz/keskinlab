name: A2 atomic daily-plan rename

on:
  push:
    branches:
      - keskinlab-stabilization-a2-preflight

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[plan-rename]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: keskinlab-stabilization-a2-preflight
          fetch-depth: 0

      - name: Rename weeks 01-09 and update runtime producers
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "gunluk-planlar-5sinif|5sinif-bty" \
            "gunluk-planlar-6sinif|6sinif-bty" \
            "gunluk-planlar-robotik|robotik-kodlama" \
            "gunluk-planlar-yapay-zeka|yapay-zeka-uygulamalari"
          do
            dir="${spec%%|*}"
            suffix="${spec##*|}"
            for n in {1..9}; do
              src="$dir/hafta${n}-${suffix}.docx"
              dst="$dir/hafta0${n}-${suffix}.docx"
              if [ -f "$src" ]; then
                git mv "$src" "$dst"
              elif [ ! -f "$dst" ]; then
                echo "Missing both $src and $dst" >&2
                exit 1
              fi
            done
          done

          python - <<'PY'
          from pathlib import Path

          classroom = Path('classroom-v2.js')
          text = classroom.read_text(encoding='utf-8')
          old = "C.plan.replace('{n}',w.hafta_no)"
          new = "C.plan.replace('{n}',String(w.hafta_no).padStart(2,'0'))"
          count = text.count(old)
          if count == 1:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit(f'classroom-v2.js: expected exactly one raw plan expansion, found {count}')
          classroom.write_text(text, encoding='utf-8')

          home = Path('home-v2.js')
          text = home.read_text(encoding='utf-8')
          old = 'hafta${n}-'
          new = "hafta${String(n).padStart(2,'0')}-"
          count = text.count(old)
          if count == 4:
              text = text.replace(old, new)
          elif text.count(new) != 4:
              raise SystemExit(f'home-v2.js: expected 4 plan factories, found raw={count}, padded={text.count(new)}')
          home.write_text(text, encoding='utf-8')
          PY

      - name: Run preflight validation before commit
        run: |
          npm ci
          npm run generate
          npm run validate

      - name: Commit atomic migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Daily-plan migration already applied."
            exit 0
          fi
          git config user.name "KeskinLab Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add classroom-v2.js home-v2.js gunluk-planlar-5sinif gunluk-planlar-6sinif gunluk-planlar-robotik gunluk-planlar-yapay-zeka
          git commit -m "Normalize daily-plan week names and runtime links [plan-rename]"
          git push origin HEAD:keskinlab-stabilization-a2-preflight
