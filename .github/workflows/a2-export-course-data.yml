name: A2 Export Course Data

on:
  push:
    branches:
      - keskinlab-stabilization-a2-engine
    paths:
      - scripts/export-course-source-data.mjs
      - .github/workflows/a2-export-course-data.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: keskinlab-stabilization-a2-engine
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export canonical course data
        run: node scripts/export-course-source-data.mjs
      - name: Commit exported data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No course-data changes."
          else
            git commit -m "Export canonical course source data"
            git push origin HEAD:keskinlab-stabilization-a2-engine
          fi
