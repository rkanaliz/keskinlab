name: Validate KeskinLab

on:
  pull_request:
  push:
    branches:
      - main
      - 'keskinlab-*'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate site data
        run: npm run generate

      - name: Validate structure
        run: npm run validate
