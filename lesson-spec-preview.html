<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>KeskinLab · Lesson Spec Preview</title>
  <link rel="icon" href="/brand/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#F4F6F3;--surface:#fff;--ink:#12182B;--text:#565F70;--muted:#8890A0;--teal:#1E8A80;--teal-dark:#146059;--amber:#E2A63B;--line:#DCE1DE;--line-strong:#BEC6C2}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,a{font:inherit}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}
    header{position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(18,24,43,.08);background:rgba(244,246,243,.94);backdrop-filter:blur(14px)}.topbar{height:66px;display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;font:700 18px "Space Grotesk"}.brand img{width:31px;height:31px}.preview-tag{margin-left:auto;font:600 8px "IBM Plex Mono";letter-spacing:.1em;color:var(--amber)}
    .hero{padding:64px 0 34px}.kicker,.mono{font:600 9px "IBM Plex Mono";letter-spacing:.09em}.kicker{color:var(--teal-dark)}h1{max-width:900px;margin:14px 0 0;font:700 clamp(38px,6vw,72px)/.98 "Space Grotesk";letter-spacing:-.055em}.hero-meta{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:22px;color:var(--text);font-size:13px}.hero-meta span{padding-top:9px;border-top:1px solid var(--line)}
    .outcome{margin:0 0 36px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:150px 1fr;gap:24px}.outcome b{font:600 9px "IBM Plex Mono";letter-spacing:.08em;color:var(--amber)}.outcome p{margin:0;font-size:14px;line-height:1.65;color:var(--text)}
    .period-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:70px}.period-card{display:flex;flex-direction:column;min-height:300px;padding:24px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.56)}.period-card .n{font:600 9px "IBM Plex Mono";color:var(--amber);letter-spacing:.09em}.period-card h2{margin:12px 0 0;font:650 clamp(28px,4vw,42px)/1.04 "Space Grotesk";letter-spacing:-.045em}.period-card p{margin:12px 0 22px;color:var(--text);font-size:13px;line-height:1.6}.period-facts{display:flex;gap:16px;margin-top:auto;padding-top:18px;border-top:1px solid var(--line);font:600 9px "IBM Plex Mono";color:var(--muted)}.start-btn{margin-top:18px;min-height:44px;border:0;border-radius:7px;background:var(--ink);color:white;padding:0 15px;font:600 10px "IBM Plex Mono";letter-spacing:.04em;cursor:pointer}
    .workspace{display:none;margin-bottom:100px;border-top:1px solid var(--line)}.workspace.open{display:block}.workspace-head{display:flex;align-items:flex-start;gap:18px;padding:26px 0 20px}.workspace-head .grow{flex:1}.workspace-head h2{margin:7px 0 0;font:650 clamp(30px,4vw,48px)/1 "Space Grotesk";letter-spacing:-.045em}.workspace-head p{margin:9px 0 0;color:var(--text);font-size:13px}.close-btn{border:1px solid var(--line-strong);background:transparent;border-radius:999px;min-height:38px;padding:0 13px;font:600 9px "IBM Plex Mono";cursor:pointer}
    .workspace-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:34px}.step-nav{position:sticky;top:88px;align-self:start;border-top:1px solid var(--line)}.step-button{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:start;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}.step-button .idx{font:600 9px "IBM Plex Mono";color:var(--amber)}.step-button b{font:600 13px "Space Grotesk";line-height:1.2}.step-button small{font:500 8px "IBM Plex Mono";color:var(--muted)}.step-button.active b{color:var(--teal-dark)}.step-button.active{background:linear-gradient(90deg,rgba(30,138,128,.055),transparent)}
    .step-stage{min-width:0}.step-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.phase{font:600 9px "IBM Plex Mono";letter-spacing:.08em;color:var(--teal-dark)}.time{margin-left:auto;font:600 9px "IBM Plex Mono";color:var(--muted)}.step-stage h3{margin:0;font:650 clamp(32px,4.7vw,58px)/1 "Space Grotesk";letter-spacing:-.052em}.curriculum-refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.curriculum-refs span{padding:5px 7px;border:1px solid var(--line);border-radius:4px;font:600 8px "IBM Plex Mono";color:var(--muted)}
    .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.action-box{border-top:2px solid var(--ink);padding:15px 0 0}.action-box.student{border-color:var(--teal)}.action-box small,.prompt small,.evidence small,.diff small,.resources-title{font:600 8px "IBM Plex Mono";letter-spacing:.09em;color:var(--muted)}.action-box p,.prompt p,.evidence p,.diff p{margin:8px 0 0;color:var(--text);font-size:14px;line-height:1.65}.prompt{margin-top:18px;padding:20px;border:1px solid var(--line);background:#fff;border-radius:10px}.prompt strong{display:block;margin-top:8px;font:600 clamp(21px,3vw,30px)/1.25 "Space Grotesk";letter-spacing:-.025em}
    .evidence{margin-top:18px;padding:18px 20px;border-left:3px solid var(--amber);background:rgba(226,166,59,.06)}.evidence-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.evidence-meta span{font:500 8px "IBM Plex Mono";color:var(--muted)}.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.diff{padding:15px 0;border-top:1px solid var(--line)}
    .resources{margin-top:30px;padding-top:22px;border-top:1px solid var(--line)}.resource-list{display:grid;gap:14px;margin-top:14px}.resource-card{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}.resource-head{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}.resource-head b{font:600 13px "Space Grotesk"}.resource-head small{margin-left:auto;font:600 8px "IBM Plex Mono";color:var(--muted)}.resource-body{padding:14px}.image-strip{display:grid;grid-auto-flow:column;grid-auto-columns:min(85%,720px);gap:12px;overflow:auto;scroll-snap-type:x mandatory}.image-strip img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;scroll-snap-align:start;background:#fff}.doc-link{display:inline-flex;min-height:40px;align-items:center;padding:0 13px;border-radius:6px;background:var(--ink);color:white;font:600 9px "IBM Plex Mono"}.player-copy{color:var(--text);font-size:13px;line-height:1.6}.player-details{display:grid;gap:8px;margin-top:12px}.player-details span{padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:12px}.teacher-led{color:var(--text);font-size:13px;line-height:1.65}
    .step-controls{display:flex;gap:10px;justify-content:flex-end;margin-top:32px;padding-top:18px;border-top:1px solid var(--line)}.step-controls button{min-height:42px;padding:0 14px;border:1px solid var(--line-strong);border-radius:7px;background:transparent;font:600 9px "IBM Plex Mono";cursor:pointer}.step-controls button.primary{background:var(--ink);border-color:var(--ink);color:#fff}.step-controls button:disabled{opacity:.35;cursor:not-allowed}
    .data-error{margin:60px 0;padding:22px;border:1px solid #b46;background:#fff}.data-error b{font:650 24px "Space Grotesk"}.data-error p{color:var(--text);line-height:1.6}
    @media(max-width:820px){.wrap{width:min(100% - 24px,1180px)}.hero{padding-top:42px}.outcome{grid-template-columns:1fr;gap:8px}.period-grid{grid-template-columns:1fr}.workspace-grid{grid-template-columns:1fr;gap:20px}.step-nav{position:static;display:grid;grid-auto-flow:column;grid-auto-columns:min(74vw,250px);overflow:auto;border:0;gap:8px}.step-button{border:1px solid var(--line);border-radius:8px;padding:11px;min-height:76px}.step-button small{display:none}.action-grid,.diff-grid{grid-template-columns:1fr}.image-strip{grid-auto-columns:94%}.workspace-head{padding-top:18px}.preview-tag{display:none}}
  </style>
</head>
<body>
  <header><div class="wrap topbar"><a class="brand" href="/"><img src="/brand/logo-mark.svg" alt=""><span>KeskinLab</span></a><span class="preview-tag">LESSON SPEC · PROTOTYPE</span></div></header>
  <main class="wrap">
    <section class="hero">
      <div class="kicker" id="heroKicker">5. SINIF BTY · HAFTA 01</div>
      <h1 id="heroTitle">Ders yaşam alanı yükleniyor…</h1>
      <div class="hero-meta"><span id="heroDuration">—</span><span id="heroPeriods">—</span><span id="heroOutcome">—</span></div>
    </section>
    <section class="outcome"><b>ÖĞRENME ÇIKTISI</b><p id="outcomeText">—</p></section>
    <section class="period-grid" id="periodGrid"></section>
    <section class="workspace" id="workspace" aria-live="polite">
      <div class="workspace-head"><div class="grow"><div class="mono" id="workspaceKicker">DERS</div><h2 id="workspaceTitle">—</h2><p id="workspaceMeta">—</p></div><button class="close-btn" id="closeWorkspace">Dersi Kapat</button></div>
      <div class="workspace-grid"><nav class="step-nav" id="stepNav" aria-label="Ders adımları"></nav><article class="step-stage" id="stepStage"></article></div>
    </section>
    <section class="data-error" id="dataError" hidden><b>Preview yüklenemedi.</b><p id="dataErrorText"></p></section>
  </main>
  <script type="module" src="/lesson-spec-preview.js"></script>
</body>
</html>
