<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KeskinLab · Lesson Player V1 Preview</title>
<link rel="icon" href="/brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F6F3;--white:#fff;--ink:#12182B;--soft:#565F70;--muted:#8890A0;--teal:#1E8A80;--teal2:#146059;--amber:#E2A63B;--line:#DCE1DE;--line2:#BEC6C2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
header{height:66px;border-bottom:1px solid var(--line);display:flex;align-items:center;background:rgba(244,246,243,.96)}.top{display:flex;align-items:center;gap:18px}.logo{display:flex;align-items:center;gap:10px;font:700 18px "Space Grotesk"}.logo img{width:34px;height:34px}.course-switch{margin-left:auto;display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px}.course-switch button{border:0;background:transparent;border-radius:999px;padding:8px 12px;font:600 9px "IBM Plex Mono";letter-spacing:.07em}.course-switch button.active{background:var(--ink);color:#fff}
.hero{padding:64px 0 70px}.ey{font:600 9px "IBM Plex Mono";letter-spacing:.1em;color:var(--teal2);display:flex;align-items:center;gap:10px}.ey:before{content:"";width:18px;height:1px;background:var(--amber)}h1{margin:18px 0 16px;font:700 clamp(46px,7vw,88px)/.92 "Space Grotesk";letter-spacing:-.06em;max-width:12ch}.lead{max-width:66ch;color:var(--soft);line-height:1.72;font-size:15px}.outcome{margin-top:30px;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font:500 10px/1.6 "IBM Plex Mono";color:var(--soft)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.btn{height:46px;padding:0 16px;border:1px solid var(--line2);background:transparent;border-radius:5px;font:600 9px "IBM Plex Mono";letter-spacing:.05em}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.primary:hover{background:var(--teal2)}
.flow{margin-top:56px}.flow h2{font:700 34px "Space Grotesk";letter-spacing:-.04em;margin:0 0 18px}.flowgrid{display:grid;grid-template-columns:repeat(5,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}.flowcard{min-height:134px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:#fff7}.flowcard.main{background:var(--ink);color:#fff}.flowcard b{font-size:14px}.flowcard span{font:600 8px "IBM Plex Mono";letter-spacing:.07em;color:var(--muted)}.flowcard.main span{color:#B8C0CF}
.lesson{display:none;position:fixed;inset:0;width:100dvw;height:100dvh;z-index:100;background:#0D1321;overflow:hidden}.lesson.open{display:block}.stage{position:absolute;inset:0;width:100dvw;height:100dvh;display:grid;place-items:center;background:#0D1321}.stage.slide-stage{overflow:hidden}.stage.interactive-stage{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--paper)}
.slide{display:block;width:auto;height:auto;max-width:100dvw;max-height:100dvh;object-fit:contain;background:#0D1321}.scene{width:100%;min-height:100dvh;background:var(--paper);color:var(--ink);padding:calc(76px + env(safe-area-inset-top)) max(7vw,24px) calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.scene.dark{background:var(--ink);color:#fff}.sl{font:600 9px "IBM Plex Mono";letter-spacing:.1em;color:var(--teal2)}.dark .sl{color:#8AD0C7}.big{font:700 clamp(44px,6vw,82px)/.96 "Space Grotesk";letter-spacing:-.055em;max-width:13ch;margin:auto 0}.bottomnote{margin-top:auto;padding-top:14px;border-top:1px solid currentColor;opacity:.55;font:600 9px "IBM Plex Mono";letter-spacing:.07em}.center{margin:auto;text-align:center}.center h2{margin:0;font:700 clamp(46px,6vw,78px)/.96 "Space Grotesk";letter-spacing:-.055em}.center p{color:var(--soft);font-size:16px}.start-activity{margin-top:22px;height:48px;padding:0 18px;border:0;border-radius:5px;background:var(--ink);color:#fff;font:600 9px "IBM Plex Mono"}
.classify{display:grid;grid-template-columns:290px 1fr;gap:24px;flex:1;min-height:0;margin-top:24px}.pool{display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--line);padding-right:18px}.card{border:1px solid var(--line2);background:#fff;padding:11px 12px;font-size:13px;font-weight:600;cursor:grab;touch-action:manipulation;user-select:none;-webkit-user-select:none}.card.selected{border-color:var(--teal);background:#EAF5F2;box-shadow:0 0 0 2px rgba(30,138,128,.12)}.card.used{opacity:.3}.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.zone{min-height:120px;border:1px dashed var(--line2);padding:12px;touch-action:manipulation}.zone.over,.zone.tap-target{border-color:var(--teal);background:#EAF5F2}.zname{font:600 8px "IBM Plex Mono";letter-spacing:.07em;color:var(--teal2)}.items{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tag{background:var(--ink);color:#fff;padding:5px 7px;border-radius:3px;font-size:10px}.reset{margin-top:14px;height:38px;padding:0 12px;border:1px solid var(--line2);background:transparent;border-radius:4px;font:600 9px "IBM Plex Mono"}.touch-help{display:none;margin-top:10px;font-size:12px;color:var(--soft);line-height:1.45}
.evidence{display:grid;grid-template-columns:1fr 320px;gap:38px;align-items:start;flex:1;margin-top:36px}.eq{font:700 clamp(36px,4.7vw,62px)/1 "Space Grotesk";letter-spacing:-.05em;max-width:15ch}.opts{display:flex;flex-direction:column;gap:8px;margin-top:26px;max-width:720px}.opt{border:1px solid var(--line2);background:#fff;padding:12px 14px;text-align:left;font-size:13px;touch-action:manipulation}.opt.selected{border-color:var(--teal);background:#EAF5F2}.teacher-note{border-left:2px solid var(--amber);padding-left:16px;color:var(--soft);line-height:1.55;font-size:13px}
.choices{display:flex;gap:12px;margin:auto;justify-content:center;flex-wrap:wrap}.choice{width:min(360px,42vw);min-height:220px;border:1px solid var(--line2);background:#fff;padding:22px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;touch-action:manipulation}.choice small{font:600 8px "IBM Plex Mono";letter-spacing:.08em;color:var(--amber)}.choice strong{font:700 28px "Space Grotesk";letter-spacing:-.04em}.choice p{font-size:13px;line-height:1.55;color:var(--soft)}
.ui{position:absolute;inset:0;pointer-events:none;transition:opacity .2s}.lesson.ui-hidden .ui{opacity:0}.topline{position:absolute;top:0;left:0;right:0;height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:center;gap:13px;background:linear-gradient(rgba(5,9,18,.82),transparent)}.brand-mini{font:700 16px "Space Grotesk"}.brand-mini b{color:#75C7BD}.meta{font:600 8px "IBM Plex Mono";letter-spacing:.07em;color:#C1C8D5}.count{margin-left:auto;font:600 8px "IBM Plex Mono";color:#C1C8D5}.prog{position:absolute;top:calc(49px + env(safe-area-inset-top));left:18px;right:18px;height:2px;background:#ffffff2c}.prog i{display:block;height:2px;background:var(--amber);width:0}.exit{position:absolute;top:calc(13px + env(safe-area-inset-top));right:18px;pointer-events:auto;border:1px solid #ffffff2e;background:#0D1321bb;color:#fff;border-radius:5px;height:34px;padding:0 11px;font:600 8px "IBM Plex Mono"}.controls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:6px;border:1px solid #ffffff27;background:#0A1020dc;border-radius:8px;pointer-events:auto;backdrop-filter:blur(10px);max-width:calc(100dvw - 24px)}.ctrl{height:38px;border:0;background:transparent;color:#fff;border-radius:4px;padding:0 12px;font:600 9px "IBM Plex Mono";white-space:nowrap}.ctrl.primary{background:#fff;color:var(--ink)}.ctrl:disabled{opacity:.3}.hint{position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));color:#ffffff75;font:600 8px "IBM Plex Mono";letter-spacing:.06em}.rotate-tip{display:none;position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);padding:7px 10px;border-radius:999px;background:#0A1020c7;color:#fff;font:600 8px "IBM Plex Mono";pointer-events:none}
@media(max-width:820px){
 .flowgrid{grid-template-columns:1fr 1fr}.meta{display:none}.brand-mini{font-size:15px}.count{padding-right:92px}.exit{right:10px}.controls{bottom:calc(10px + env(safe-area-inset-bottom));gap:2px;padding:5px}.ctrl{padding:0 10px}.hint{display:none}
 .scene{padding-left:22px;padding-right:22px}.big{font-size:clamp(42px,12vw,66px)}
 .classify{grid-template-columns:1fr;gap:16px;display:block}.pool{border-right:0;border-bottom:1px solid var(--line);padding:0 0 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.zones{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}.zone{min-height:140px}.touch-help{display:block}.evidence{grid-template-columns:1fr}.teacher-note{display:none}.choice{width:100%}
}
@media(max-width:820px) and (orientation:portrait){.rotate-tip{display:block}.slide{max-width:100dvw;max-height:100dvh}}
@media(max-height:500px) and (orientation:landscape){.topline{height:46px}.prog{top:40px}.controls{bottom:8px}.exit{top:7px}.rotate-tip{display:none}}
</style>
</head>
<body>
<header><div class="wrap top"><a class="logo" href="/"><img src="/brand/logo-mark.svg" alt=""><span>KeskinLab</span></a><div class="course-switch"><button class="active" data-course="5">5. SINIF</button><button data-course="6">6. SINIF</button></div></div></header>
<main class="wrap hero"><div class="ey" id="ey"></div><h1 id="title"></h1><div class="lead" id="lead"></div><div class="outcome" id="outcome"></div><div class="actions"><button class="btn primary" id="start">DERSİ BAŞLAT →</button><button class="btn" onclick="document.querySelector('.flow').scrollIntoView({behavior:'smooth'})">AKIŞI GÖR</button></div><section class="flow"><h2>V1 ders deneyimi</h2><div class="flowgrid"><div class="flowcard"><b>Açılış sorusu</b><span>30–90 SN · ÖN DEĞERLENDİRME</span></div><div class="flowcard main"><b>10 görsel slayt</b><span>MEVCUT KESKİNLAB SUNUMU</span></div><div class="flowcard"><b>Pekiştirme</b><span>ETKİLEŞİM · KONUYA GÖRE</span></div><div class="flowcard"><b>Öğrenme kanıtı</b><span>KISA KONTROL + GEREKÇE</span></div><div class="flowcard"><b>Destek / Zenginleştir</b><span>İSTEĞE BAĞLI</span></div></div></section></main>
<section class="lesson" id="lesson"><div class="stage" id="stage"></div><div class="ui"><div class="topline"><div class="brand-mini">Keskin<b>Lab</b></div><div class="meta" id="lessonMeta"></div><div class="count" id="count"></div><div class="prog"><i id="progress"></i></div></div><button class="exit" id="exit">ESC · ÇIKIŞ</button><div class="controls"><button class="ctrl" id="prev">←</button><button class="ctrl primary" id="next">İLERİ →</button><button class="ctrl" id="fs">TAM EKRAN</button></div><div class="hint">← → · SPACE · F · ESC</div><div class="rotate-tip" id="rotateTip">SLAYT İÇİN TELEFONU YATAY ÇEVİR</div></div></section>
<script>
const DATA={5:{name:'5. SINIF · BTY · HAFTA 01',topic:'Bilişim Teknolojilerinin Sınıflandırılması',lead:'Mevcut görsel sunum ana anlatım omurgası. Sunum bittiğinde öğrenci, öğrendiğini sınıflandırma etkinliğinde uygular.',outcome:'BTY.5.1.1 · Günlük yaşamda kullanılan bilişim teknolojilerini sınıflandırabilme',opening:'Bugün evden çıkıp okula gelene kadar kaç farklı teknoloji kullandın?',cards:['Akıllı tahta','MR cihazı','Navigasyon','Telefon','Tablet','Oyun konsolu'],zones:['EĞİTİM','SAĞLIK','ULAŞIM','İLETİŞİM','EĞLENCE','BİRDEN FAZLA'],evidence:'Tablet yalnızca eğitim alanına mı aittir?',opts:['Evet, yalnızca eğitimde kullanılır.','Hayır, kullanım amacına göre birden fazla alana girebilir.','Tablet bilişim teknolojisi değildir.'],support:'Kavram kartlarıyla temel kavramları eşleştir.',enrich:'Geçmişten günümüze bir teknoloji için mini zaman çizgisi oluştur.'},6:{name:'6. SINIF · BTY · HAFTA 01',topic:'Yenilikçi Bilişim Teknolojileri',lead:'Aynı player bu kez 6. sınıfın mevcut görsel sunumunu taşır; pekiştirme bölümü yenilikçi teknolojilerin kullanım alanlarına göre değişir.',outcome:'BTY.6.1.1 · Yenilikçi bilişim teknolojilerini sınıflandırabilme',opening:'Bugün kullandığın teknolojilerden hangisine “yenilikçi” dersin? Neden?',cards:['Artırılmış gerçeklik','Sanal gerçeklik','Yapay zekâ','Akıllı saat','Bulut sistemi','Yüz tanıma'],zones:['EĞİTİM','SAĞLIK','ULAŞIM','İLETİŞİM','EĞLENCE','ORTAK ÇALIŞMA'],evidence:'Akıllı saat yalnızca sağlık alanına mı aittir?',opts:['Evet, yalnızca sağlık amacıyla kullanılır.','Hayır, kullanım amacına göre farklı alanlara girebilir.','Akıllı saat yenilikçi teknoloji değildir.'],support:'Teknoloji adını kısa tanımıyla eşleştir.',enrich:'Seçtiğin yenilikçi teknolojinin iki farklı kullanım alanını araştır ve ilişkilendir.'}};
let course=5,index=0,dragging=null,selectedCard=null,hideTimer=null;
const seq=()=>[{type:'opening'},...Array.from({length:10},(_,k)=>({type:'slide',n:k+1})),{type:'transition'},{type:'reinforce'},{type:'evidence'},{type:'choice'}];
function setCourse(c){course=Number(c);document.querySelectorAll('[data-course]').forEach(b=>b.classList.toggle('active',Number(b.dataset.course)===course));const d=DATA[course];ey.textContent=d.name+' · 14–18 EYLÜL 2026';title.textContent=d.topic;lead.textContent=d.lead;outcome.textContent=d.outcome}
function slideUrl(n){return `/materyaller/${course}-sinif/hafta01/sunum/${String(n).padStart(2,'0')}.png`}
function render(){const d=DATA[course],s=seq()[index];stage.className='stage '+(s.type==='slide'?'slide-stage':'interactive-stage');lessonMeta.textContent=d.name;count.textContent=`${String(index+1).padStart(2,'0')} / ${String(seq().length).padStart(2,'0')}`;progress.style.width=`${(index+1)/seq().length*100}%`;prev.disabled=index===0;next.textContent=index===seq().length-1?'DERSİ BİTİR':'İLERİ →';rotateTip.style.display=s.type==='slide'?'':'none';let h='';if(s.type==='opening'){h=`<div class="scene dark"><div class="sl">DERS BAŞLANGICI · ÖN DEĞERLENDİRME</div><div class="big">${d.opening}</div><div class="bottomnote">CEVAPLARI ÖNCE SINIFTAN TOPLA · SONRA SUNUMA GEÇ</div></div>`}else if(s.type==='slide'){h=`<img class="slide" src="${slideUrl(s.n)}" alt="${course}. sınıf slayt ${s.n}">`}else if(s.type==='transition'){h=`<div class="scene"><div class="sl">SUNUM TAMAMLANDI</div><div class="center"><h2>Şimdi pekiştirelim.</h2><p>Öğrenciler öğrendiklerini tahtada uygulayacak.</p><button class="start-activity" onclick="next.click()">ETKİNLİĞE GEÇ →</button></div></div>`}else if(s.type==='reinforce'){h=`<div class="scene"><div class="sl">PEKİŞTİRME · SINIFLANDIRMA</div><h2 style="font:700 clamp(34px,4.5vw,54px)/1 'Space Grotesk';letter-spacing:-.05em;margin:12px 0 0">Kartları kullanım alanlarına yerleştir.</h2><div class="touch-help">Telefonda: önce karta, sonra yerleştirmek istediğin alana dokun.</div><div class="classify"><div class="pool">${d.cards.map(x=>`<div class="card" draggable="true" role="button" tabindex="0" data-card="${x}">${x}</div>`).join('')}</div><div class="zones">${d.zones.map(z=>`<div class="zone" role="button" tabindex="0" data-zone="${z}"><div class="zname">${z}</div><div class="items"></div></div>`).join('')}</div></div><button class="reset" onclick="render()">SIFIRLA</button></div>`}else if(s.type==='evidence'){h=`<div class="scene"><div class="sl">ÖĞRENME KANITI</div><div class="evidence"><div><div class="eq">${d.evidence}</div><div class="opts">${d.opts.map((o,k)=>`<button class="opt">${String.fromCharCode(65+k)} · ${o}</button>`).join('')}</div></div><div class="teacher-note"><b style="color:var(--ink)">SADECE İŞARETLEME YETMEZ.</b><br><br>Öğrenciden seçimini bir cümleyle gerekçelendirmesini iste.</div></div></div>`}else{h=`<div class="scene"><div class="sl">DERS SONU · İSTEĞE BAĞLI</div><div class="choices"><button class="choice"><small>DESTEKLE</small><strong>Daha somut çalışalım.</strong><p>${d.support}</p></button><button class="choice"><small>ZENGİNLEŞTİR</small><strong>Bir adım ileri gidelim.</strong><p>${d.enrich}</p></button></div><div class="bottomnote">BU EKRAN ZORUNLU DEĞİL · SINIFIN İHTİYACINA GÖRE KULLAN</div></div>`}stage.innerHTML=h;attach();showUi()}
function placeCard(card,zone){if(!card||card.classList.contains('used'))return;const t=document.createElement('span');t.className='tag';t.textContent=card.dataset.card;zone.querySelector('.items').appendChild(t);card.classList.remove('selected');card.classList.add('used');card.draggable=false;selectedCard=null;document.querySelectorAll('.zone').forEach(z=>z.classList.remove('tap-target'))}
function selectCard(card){if(card.classList.contains('used'))return;document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));if(selectedCard===card){selectedCard=null;document.querySelectorAll('.zone').forEach(z=>z.classList.remove('tap-target'));return}selectedCard=card;card.classList.add('selected');document.querySelectorAll('.zone').forEach(z=>z.classList.add('tap-target'))}
function attach(){document.querySelectorAll('.card').forEach(card=>{card.addEventListener('dragstart',e=>{dragging=card;e.dataTransfer.setData('text/plain',card.dataset.card)});card.addEventListener('click',()=>selectCard(card));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectCard(card)}})});document.querySelectorAll('.zone').forEach(zone=>{zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over')});zone.addEventListener('dragleave',()=>zone.classList.remove('over'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');placeCard(dragging,zone);dragging=null});zone.addEventListener('click',()=>{if(selectedCard)placeCard(selectedCard,zone)});zone.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&selectedCard){e.preventDefault();placeCard(selectedCard,zone)}})});document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));o.classList.add('selected')})}
function showUi(){lesson.classList.remove('ui-hidden');clearTimeout(hideTimer);if(seq()[index].type==='slide'){hideTimer=setTimeout(()=>lesson.classList.add('ui-hidden'),2200)}}
async function leave(){if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}lesson.classList.remove('open');document.body.style.overflow=''}
start.onclick=()=>{index=0;lesson.classList.add('open');document.body.style.overflow='hidden';render()};exit.onclick=leave;prev.onclick=()=>{if(index>0){index--;render()}};next.onclick=()=>{if(index<seq().length-1){index++;render()}else leave()};fs.onclick=async()=>{try{if(!document.fullscreenElement)await lesson.requestFullscreen();else await document.exitFullscreen()}catch(e){}};document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>setCourse(b.dataset.course));lesson.addEventListener('pointermove',showUi,{passive:true});lesson.addEventListener('pointerdown',e=>{if(!e.target.closest('button,.card,.zone'))showUi()},{passive:true});document.addEventListener('keydown',e=>{if(!lesson.classList.contains('open'))return;if(e.key==='ArrowRight'||e.key===' '){if(document.activeElement?.classList.contains('card')||document.activeElement?.classList.contains('zone'))return;e.preventDefault();next.click()}if(e.key==='ArrowLeft')prev.click();if(e.key.toLowerCase()==='f')fs.click();if(e.key==='Escape'&&!document.fullscreenElement)leave()});setCourse(5)
</script>
</body>
</html>
